version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: todo-backend:latest
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://neondb_owner:npg_O1mLbVXkfEY5@ep-broad-fog-a4ba5mi3-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require
      - GROQ_API_KEY=YOUR_GROQ_API_KEY

  chatbot:
    build:
      context: ./Chatbot
      dockerfile: Dockerfile
    image: todo-chatbot:latest
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: todo-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - BETTER_AUTH_SECRET=development-secret-key-1234567890
      - BETTER_AUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

