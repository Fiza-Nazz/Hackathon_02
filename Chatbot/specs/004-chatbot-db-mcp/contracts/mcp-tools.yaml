## Tool 5: update_task

**Purpose**: Update task title and/or description

**Input Schema**:
```yaml
user_id:
  type: string
  required: true
  description: User identifier from JWT token
  example: "user_abc123"

task_id:
  type: integer
  required: true
  min: 1
  description: Task identifier to update
  example: 123

title:
  type: string
  required: false
  min_length: 1
  max_length: 200
  description: New task title
  example: "Buy groceries and milk"

description:
  type: string
  required: false
  min_length: 0
  max_length: 1000
  description: New task description
  example: "Updated shopping list"
```

**Success Response**:
```yaml
success: true
data:
  task_id: 123
  status: "updated"
  title: "Buy groceries and milk"
error: null
```

**Error Responses**:
```yaml
# Neither title nor description provided
success: false
error:
  code: INVALID_INPUT
  message: "At least one field (title or description) must be provided"

# Task not found or doesn't belong to user
success: false
error:
  code: NOT_FOUND
  message: "Task not found"

# Title too short or empty
success: false
error:
  code: INVALID_INPUT
  message: "Title must be between 1 and 200 characters"

# Title too long
success: false
error:
  code: INVALID_INPUT
  message: "Title exceeds 200 character limit"

# Description too long
success: false
error:
  code: INVALID_INPUT
  message: "Description exceeds 1000 character limit"

# Database error
success: false
error:
  code: DATABASE_ERROR
  message: "Failed to update task"
```

**Validation Rules**:
- User ID required, non-empty
- Task ID required, positive integer (>= 1)
- At least one of title or description must be provided
- Title: 1-200 characters if provided
- Description: 0-1000 characters if provided

**Query Logic**:
- Build UPDATE query dynamically based on provided fields
- UPDATE tasks SET title = ?, description = ?, updated_at = NOW() WHERE id = ? AND user_id = ?
- If 0 rows affected → return NOT_FOUND

**Security Note**: Return NOT_FOUND (not UNAUTHORIZED) for tasks owned by other users (security by obscurity)

---

## Security Requirements

All tools MUST enforce:

1. **User Isolation**:
   - Filter all queries by `user_id`
   - Verify task ownership before modification/deletion
   - Return NOT_FOUND instead of UNAUTHORIZED for missing resources

2. **Input Validation**:
   - Validate all inputs via Pydantic models
   - Sanitize inputs before database operations
   - Never trust user input

3. **Error Handling**:
   - Catch all exceptions
   - Convert to appropriate error code
   - Never expose raw database errors
   - Log full errors server-side

4. **Idempotency**:
   - Operations safe to retry
   - complete_task idempotent (no error if already complete)

---

## Performance Requirements

- **Response Time**: < 500ms per tool execution (95th percentile)
- **Database Query**: < 100ms per query
- **Concurrent Requests**: Handle multiple simultaneous tool calls
- **Scalability**: Stateless design enables horizontal scaling
