[project]
name = "todo-app"
version = "0.1.0"
description = "AI-Native Todo Application (Phase I CLI)"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
todo-app = "src.cli.todo_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/**", "specs/**", "README.md", "CLAUDE.md", "uv.lock", "pyproject.toml"]
exclude = ["**/*.db", ".venv/**", "frontend/**", "backend/**", "Chatbot/**"]

[tool.hatch.build.targets.wheel.force-include]
"src" = "src"
