apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: redpandadata/redpanda:latest
        command:
          - redpanda
          - start
          - --smp
          - "1"
          - --memory
          - 1G
          - --reserve-memory
          - 0M
          - --overprovisioned
          - --node-id
          - "0"
          - --kafka-addr
          - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
          - --advertise-kafka-addr
          - PLAINTEXT://kafka:29092,OUTSIDE://kafka:9092
          - --pandaproxy-addr
          - 0.0.0.0:8082
          - --advertise-pandaproxy-addr
          - kafka:8082
          - --schema-registry-addr
          - 0.0.0.0:8081
          - --rpc-addr
          - 0.0.0.0:33145
          - --advertise-rpc-addr
          - kafka:33145
          - --check=false
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 8081
          name: schema-registry
        - containerPort: 8082
          name: rest-proxy
        - containerPort: 9644
          name: admin
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/redpanda/data
      volumes:
      - name: kafka-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: default
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka
  - port: 8081
    targetPort: 8081
    name: schema-registry
  - port: 8082
    targetPort: 8082
    name: rest-proxy
  - port: 9644
    targetPort: 9644
    name: admin
  type: ClusterIP
