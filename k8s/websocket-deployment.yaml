apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-websocket
  labels:
    app: todo-websocket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-websocket
  template:
    metadata:
      labels:
        app: todo-websocket
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "todo-websocket"
        dapr.io/app-port: "8001"
    spec:
      containers:
      - name: websocket
        image: todo-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
          name: ws
        env:
        - name: SERVICE_TYPE
          value: "websocket"
        - name: KAFKA_BROKERS
          value: "redpanda:9092"
        - name: DAPR_HOST
          value: "localhost"
        - name: DAPR_PORT
          value: "3500"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: todo-websocket
  labels:
    app: todo-websocket
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: ws
  selector:
    app: todo-websocket
