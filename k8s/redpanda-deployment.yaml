apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  labels:
    app: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:latest
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 8081
          name: schema-registry
        - containerPort: 9644
          name: admin
        command:
        - redpanda
        - start
        - --kafka-addr
        - internal://0.0.0.0:9092,external://0.0.0.0:19092
        - --advertise-kafka-addr
        - internal://redpanda:9092,external://redpanda:19092
        - --schema-registry-addr
        - internal://0.0.0.0:8081,external://0.0.0.0:18081
        - --rpc-addr
        - 0.0.0.0:33145
        - --advertise-rpc-addr
        - redpanda:33145
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - rpk
            - cluster
            - info
            - --brokers=localhost:9092
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: redpanda-data
          mountPath: /var/lib/redpanda/data
      volumes:
      - name: redpanda-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    app: redpanda
spec:
  type: ClusterIP
  ports:
  - port: 9092
    targetPort: 9092
    protocol: TCP
    name: kafka
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: schema-registry
  - port: 9644
    targetPort: 9644
    protocol: TCP
    name: admin
  selector:
    app: redpanda
