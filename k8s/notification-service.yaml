apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: python:3.13-slim
        command: ["python", "/app/services/notification_service.py"]
        workingDir: /app
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: WEBSOCKET_PORT
          value: "8765"
        volumeMounts:
        - name: app-code
          mountPath: /app
        ports:
        - containerPort: 8765
          name: websocket
      volumes:
      - name: app-code
        hostPath:
          path: /hosthome/Hackathon_02
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: default
spec:
  selector:
    app: notification-service
  ports:
  - port: 8765
    targetPort: 8765
    name: websocket
  type: ClusterIP
