name: Phase V - Build and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todouser
          POSTGRES_PASSWORD: todopass123
          POSTGRES_DB: tododb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      env:
        DATABASE_URL: postgresql://todouser:todopass123@localhost:5432/tododb
      run: |
        cd backend
        pytest tests/ -v --tb=short
    
    - name: Run linting
      run: |
        cd backend
        pip install flake8
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
    
    - name: Build and push Backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}-backend
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}
    
    - name: Install Dapr
      run: |
        wget -q https://raw.githubusercontent.com/dapr/cli/master/install/install.sh -O - | /bin/bash
        dapr init -k --wait --timeout 300
    
    - name: Deploy Kafka
      run: |
        kubectl apply -f k8s/kafka-deployment.yaml
        kubectl wait --for=condition=ready pod -l app=kafka --timeout=300s
    
    - name: Deploy Dapr Components
      run: |
        kubectl apply -f dapr-components/
    
    - name: Deploy Microservices
      run: |
        kubectl apply -f k8s/notification-service.yaml
        kubectl apply -f k8s/recurring-task-service.yaml
        kubectl wait --for=condition=ready pod -l app=notification-service --timeout=300s
        kubectl wait --for=condition=ready pod -l app=recurring-task-service --timeout=300s
    
    - name: Deploy Main Services
      run: |
        kubectl apply -f charts/todo-chatbot/templates/
        kubectl rollout status deployment/todo-chatbot-backend
        kubectl rollout status deployment/todo-chatbot-frontend
        kubectl rollout status deployment/todo-chatbot-chatbot
    
    - name: Verify deployment
      run: |
        echo "📊 Deployment Status:"
        kubectl get pods
        kubectl get services
        kubectl get deployments
    
    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests..."
        # Wait for services to be ready
        sleep 30
        
        # Test backend health
        BACKEND_URL=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        curl -f http://$BACKEND_URL:8000/health || exit 1
        
        # Test Kafka connectivity
        kubectl exec -it $(kubectl get pod -l app=kafka -o jsonpath='{.items[0].metadata.name}') -- rpk cluster info
        
        echo "✅ All smoke tests passed!"
    
    - name: Notify deployment
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi
