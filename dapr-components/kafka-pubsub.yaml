apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: "localhost:19092"
  - name: consumerGroup
    value: "todo-service"
  - name: authRequired
    value: "false"
  - name: maxMessageBytes
    value: "1024"
  - name: consumeRetryInterval
    value: "200ms"
scopes:
- backend-service
- notification-service
- recurring-task-service